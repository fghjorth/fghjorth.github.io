name: Publish site

on:
  push:
    branches: [master]
  workflow_dispatch:
  # TEMPORARY — added 2026-08-06 during a GitHub Actions major outage that left
  # the first deploy stuck in the queue. This retries automatically until the
  # new site is live, then the `check` job below turns scheduled runs into
  # no-ops. Safe to delete this `schedule:` block once the site is up.
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Scheduled retries should do nothing once the site is actually live. Push and
  # manual runs always proceed. The generator meta tag is the reliable marker —
  # the font name only appears URL-encoded in the HTML, so don't grep for that.
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.q.outputs.needed }}
    steps:
      - id: q
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Not a scheduled run — proceeding."
            exit 0
          fi
          if curl -sfL --max-time 20 https://fghjorth.github.io/ \
               | grep -q '<meta name="generator" content="quarto-'; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Site already serving the Quarto build — nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Still serving the old build — retrying deploy."
          fi

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo carries ~130MB of conference PDFs; .git is over 150MB.
          # A shallow clone keeps CI from pulling all of that history.
          fetch-depth: 1

      - uses: quarto-dev/quarto-actions/setup@v2

      # Content is plain markdown — no R or Jupyter, so nothing else to install.
      - name: Render site
        run: quarto render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
